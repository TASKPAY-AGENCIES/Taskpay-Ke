<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For BABE♥️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh;
    background: radial-gradient(circle at 20% 50%, #ff006e, #8338ec, #3a86ff, #000);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow:hidden;
    display:flex;justify-content:center;align-items:center;
    font-family: 'Outfit', sans-serif;
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
  }

.loader{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:999;transition:1s;
  }
.loader.hide{opacity:0;pointer-events:none}
.loader-text{
    color:#ff006e;font-size:1.5rem;font-weight:600;margin-bottom:20px;
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.4}}
.progress{
    width:300px;height:4px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;
  }
.progress-bar{
    height:100%;width:0%;background:linear-gradient(90deg,#ff006e,#3a86ff);
    animation:load 3s ease forwards;
  }
  @keyframes load{to{width:100%}}

.glass{
    width:90%;max-width:500px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 40px 30px;
    text-align:center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transform:translateY(50px);opacity:0;
    transition:1.5s;
  }
.glass.show{transform:translateY(0);opacity:1}

.photo{
    width:180px;height:180px;border-radius:50%;
    object-fit:cover;border:3px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 40px rgba(255,0,110,0.6);
    margin-bottom:20px;
  }

  h1{
    font-size:2rem;font-weight:800;
    background: linear-gradient(90deg, #ff006e, #ffbe0b, #3a86ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom:15px;
  }
.message{
    color: rgba(255,255,255,0.9);
    font-size:1rem;font-weight:300;
    line-height:1.8;text-align:left;
    max-height:250px;overflow-y:auto;padding-right:10px;min-height:200px;
  }
.message::-webkit-scrollbar{width:4px}
.message::-webkit-scrollbar-thumb{background:#ff006e;border-radius:10px}
.cursor{
    display:inline-block;width:2px;height:18px;background:#ff006e;
    animation:blink 0.8s infinite;vertical-align:text-bottom;margin-left:2px;
  }
  @keyframes blink{50%{opacity:0}}

.particle{
    position:absolute;width:3px;height:3px;
    background:#fff;border-radius:50%;
    box-shadow:0 0 10px #fff;
    animation: rise 10s infinite linear;
  }
  @keyframes rise{
    0%{transform:translateY(100vh) scale(0); opacity:0}
    50%{opacity:1}
    100%{transform:translateY(-10vh) scale(1.5); opacity:0}
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loader" id="loader">
  <div class="loader-text">TO YOU MY LOVE[tetyoo]♥️...</div>
  <div class="progress"><div class="progress-bar"></div></div>
</div>

<!-- MAIN CONTENT -->
<div class="glass" id="glass">
  <img src="https://i.postimg.cc/jdkNMpvp/IMG-20260327-WA0054(1).jpg" class="photo" alt="BABE">
  <h1>Happy Girlfriend's Day BABE♥️</h1>
  <div class="message" id="message"></div><span class="cursor" id="cursor"></span>
</div>

<script>
const fullMessage = `HEY BABE ♥️

Am happy to celebrate 4 months down the line with you, it's been as sweet as I can't put it in words. Nakupenda sana mine, you have been true since, showed up to me several times and I appreciate it 🙏

Today being girlfriend's day,am happy to celebrate you as my genuine and a true partner 🫶🥰. Uko mstrong sana dee!
Enjoy your day 💖

Been busy all day, didn't even get enough time for, didn't bought presents for you, but I know you gonna understand Me babe 😔🥰

Nakupenda sana, tena sana and I'm here to stay and build a future with you ♥️

ILYSM 💖💖💖`;

let i = 0;
function typeWriter(){
  if(i < fullMessage.length){
    document.getElementById('message').innerHTML += fullMessage[i] === '\n'? '<br>' : fullMessage[i];
    i++;
    document.getElementById('message').scrollTop = document.getElementById('message').scrollHeight;
    setTimeout(typeWriter, 90); // SLOWER TYPING SPEED
  } else {
    document.getElementById('cursor').style.display = 'none';
  }
}

// Loading then show + start typing
setTimeout(()=>{
  document.getElementById('loader').classList.add('hide');
  document.getElementById('glass').classList.add('show');
  setTimeout(typeWriter, 800);
}, 3000);

// Particles
function createParticle(){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = Math.random()*5 + 5 + 's';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 10000);
}
setInterval(createParticle, 150);

// 3D tilt
const glass = document.getElementById('glass');
document.addEventListener('mousemove', (e)=>{
  let x = (window.innerWidth/2 - e.pageX)/25;
  let y = (window.innerHeight/2 - e.pageY)/25;
  glass.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
})
</script>
</body>
</html>
